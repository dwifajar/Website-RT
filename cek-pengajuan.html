<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cek Pengajuan — Dusun Dawung</title><link rel="stylesheet" href="assets/style.css"><style>
.check-wrap{max-width:760px;margin:48px auto;padding:0 20px}.check-card{background:#fff;border-radius:20px;padding:30px;box-shadow:0 10px 35px rgba(0,0,0,.08)}.check-card h1{margin:8px 0}.check-card p{color:#68736c}.check-form{display:grid;gap:14px;margin-top:24px}.check-form input{width:100%;box-sizing:border-box;padding:14px 15px;border:1px solid #dce3dd;border-radius:12px;font-size:16px}.check-result{margin-top:22px}.result-row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #edf0ed}.result-row span:first-child{color:#6a746d}.result-row b{text-align:right}.status{display:inline-block;padding:7px 11px;border-radius:999px;background:#eef5ee}.back{display:inline-block;margin-top:18px;color:#315c3d;text-decoration:none;font-weight:600}.error{color:#a33b3b;background:#fff1f1;padding:12px;border-radius:10px}
</style></head><body><header class="header"><a class="logo" href="index.html"><span class="logo-mark">🌿</span><span><strong>DUSUN DAWUNG</strong><small>RT 04 / RW 01</small></span></a><nav><a href="index.html">Beranda</a><a class="active" href="pelayanan.html">Pelayanan</a><a class="login-pill" href="login.html">Masuk Warga</a></nav></header><main class="check-wrap"><section class="check-card"><small>PELAYANAN WARGA</small><h1>Cek Pengajuan</h1><p>Masukkan kode pengajuan yang Anda terima setelah mengirim formulir.</p><form id="checkForm" class="check-form"><input id="kode" autocomplete="off" placeholder="Contoh: PGJ-2026-A1B2C3D4" required><button class="btn green" type="submit">Cek Status</button></form><div id="result" class="check-result"></div><a class="back" href="index.html">← Kembali ke Website</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/supabase.js"></script><script>
const sb=window.DAWUNG_SUPABASE,result=document.getElementById('result');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const labels={menunggu:'Menunggu',diproses:'Diproses',selesai:'Selesai',ditolak:'Ditolak'};document.getElementById('checkForm').addEventListener('submit',async e=>{e.preventDefault();result.innerHTML='<p>Memeriksa pengajuan...</p>';const kode=document.getElementById('kode').value.trim().toUpperCase();const {data,error}=await sb.rpc('cek_pengajuan_public',{p_kode:kode});if(error){result.innerHTML='<div class="error">Pengajuan belum dapat diperiksa. Pastikan konfigurasi pelayanan publik sudah diterapkan.</div>';return}if(!data||!data.length){result.innerHTML='<div class="error">Kode pengajuan tidak ditemukan. Periksa kembali kode yang Anda masukkan.</div>';return}const x=data[0];result.innerHTML=`<div class="result-row"><span>Kode Pengajuan</span><b>${esc(x.kode_pengajuan)}</b></div><div class="result-row"><span>Pemohon</span><b>${esc(x.pemohon_nama)}</b></div><div class="result-row"><span>Jenis Surat</span><b>${esc(x.jenis_label||x.jenis)}</b></div><div class="result-row"><span>Tanggal</span><b>${esc(x.tanggal_pengajuan||'-')}</b></div><div class="result-row"><span>Status</span><b><span class="status">${esc(labels[x.status]||x.status)}</span></b></div><div class="result-row"><span>Nomor Surat</span><b>${esc(x.nomor_surat||'-')}</b></div><div class="result-row"><span>Catatan</span><b>${esc(x.catatan_admin||'-')}</b></div>`});
</script></body></html>
