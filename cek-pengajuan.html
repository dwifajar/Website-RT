<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cek Pengajuan — Dusun Dawung</title><link rel="stylesheet" href="assets/style.css"><style>
.check-wrap{max-width:760px;margin:48px auto;padding:0 20px}.check-card{background:#fff;border-radius:20px;padding:30px;box-shadow:0 10px 35px rgba(0,0,0,.08)}.check-card h1{margin:8px 0}.check-card p{color:#68736c}.check-form{display:grid;gap:14px;margin-top:24px}.check-form input{width:100%;box-sizing:border-box;padding:14px 15px;border:1px solid #dce3dd;border-radius:12px;font-size:16px}.check-result{margin-top:22px}.result-row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #edf0ed}.result-row span:first-child{color:#6a746d}.result-row b{text-align:right}.status{display:inline-block;padding:7px 11px;border-radius:999px;background:#eef5ee}.back{display:inline-block;margin-top:18px;color:#315c3d;text-decoration:none;font-weight:600}.error{color:#a33b3b;background:#fff1f1;padding:12px;border-radius:10px}.verify-ok{color:#276a3b;background:#edf8ef;border:1px solid #d5ead8;padding:12px;border-radius:10px;margin-bottom:14px}.download-box{margin-top:18px;padding:16px;border:1px solid #d7e5d9;border-radius:14px;background:#f7fbf7}.download-box p{margin:5px 0 12px}.download-box small{display:block;color:#6b756e;margin-top:8px}.download-box .btn{margin-top:2px}
</style>
<style id="premium-download-ui">
.download-box.premium-download-box{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;padding:22px 16px 24px;background:linear-gradient(145deg,#fff 0%,#f8f5ff 100%);border:1px solid #e7dcff;border-radius:20px;box-shadow:0 12px 30px rgba(79,35,160,.08)}
.premium-download-box>p{max-width:460px}
.premium-download-btn{--premium:#7027e8;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:transparent;color:#5420bb;padding:5px 14px 0;cursor:pointer;font:inherit;transition:transform .25s ease,filter .25s ease;min-width:150px}
.premium-download-btn:hover{transform:translateY(-3px);filter:drop-shadow(0 7px 12px rgba(112,39,232,.2))}
.premium-download-btn:active{transform:scale(.97)}
.premium-download-btn:focus-visible{outline:3px solid #c7a8ff;outline-offset:5px;border-radius:16px}
.premium-download-ring{width:112px;height:112px;position:relative;display:grid;place-items:center}
.premium-download-ring>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.premium-ring-track,.premium-ring-progress{fill:none;stroke-width:4.5}
.premium-ring-track{stroke:#e5d9ff}
.premium-ring-progress{stroke:#7027e8;stroke-linecap:round;stroke-dasharray:270.18;stroke-dashoffset:270.18;transition:stroke-dashoffset .22s ease}
.premium-download-icon{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#812fff,#5b16d5);box-shadow:0 7px 18px rgba(100,34,213,.3),inset 0 1px 1px rgba(255,255,255,.35);color:#fff;transition:background .25s ease,box-shadow .25s ease}
.premium-download-icon svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.premium-download-label{font-weight:750;font-size:14px;color:#5420bb;letter-spacing:.1px}
.premium-download-percent{min-width:88px;padding:5px 13px;border-radius:999px;background:linear-gradient(135deg,#7928e8,#5b17c9);color:#fff;font-size:11px;font-weight:750;box-shadow:0 4px 10px rgba(105,33,207,.18)}
.premium-download-btn.is-downloading{cursor:wait}.premium-download-btn.is-downloading .premium-download-icon{animation:premiumPulse 1.1s ease-in-out infinite}
.premium-download-btn.is-complete .premium-download-icon{background:linear-gradient(145deg,#20c779,#0a9d58);box-shadow:0 7px 18px rgba(16,185,103,.25)}
.premium-download-btn.is-complete .premium-ring-progress{stroke:#19b96f}
.premium-download-btn.is-complete .premium-download-percent{background:linear-gradient(135deg,#20c779,#0a9d58)}
@keyframes premiumPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){.premium-download-btn,.premium-ring-progress,.premium-download-icon{transition:none}.premium-download-btn.is-downloading .premium-download-icon{animation:none}}
</style>
