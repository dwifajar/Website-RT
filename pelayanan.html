<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelayanan Warga — Dusun Dawung</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.service-wrap{max-width:980px;margin:34px auto;padding:0 20px 60px}
.service-card{background:#fff;border-radius:22px;padding:28px;box-shadow:0 12px 40px rgba(18,48,28,.08)}
.service-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}
.service-head h1{margin:6px 0}.service-head p{color:#68736c;margin:0}
.back-link{color:#315c3d;text-decoration:none;font-weight:700}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form-field{display:flex;flex-direction:column;gap:7px}
.form-field.full{grid-column:1/-1}
.form-field label{font-weight:700;font-size:14px}
.form-field input,.form-field select,.form-field textarea{width:100%;box-sizing:border-box;padding:12px 13px;border:1px solid #dce3dd;border-radius:11px;background:#fff;font:inherit}
.form-field textarea{min-height:110px;resize:vertical}
.required{color:#b54444}.help{font-size:12px;color:#78827c}
.section-title{grid-column:1/-1;margin-top:8px;padding-bottom:8px;border-bottom:1px solid #edf0ed}
.actions{display:flex;gap:12px;align-items:center;margin-top:22px}
.btn{border:0;cursor:pointer}.btn:disabled{opacity:.6;cursor:not-allowed}
.notice{padding:13px 15px;border-radius:12px;margin:15px 0}
.notice.info{background:#f1f6f1}.notice.error{background:#fff1f1;color:#8e3838}
.success{background:#f1f7f0;border:1px solid #d7e7d5;border-radius:16px;padding:22px}
.code-box{font-size:25px;font-weight:800;letter-spacing:1px;padding:15px;background:#fff;border:1px dashed #8da58f;border-radius:12px;margin:14px 0;text-align:center}
@media(max-width:720px){.form-grid{grid-template-columns:1fr}.service-head{flex-direction:column}.form-field.full{grid-column:auto}}

/* Premium public service form — scoped to this page, keeps existing form behavior intact. */
.service-minimal-header{justify-content:flex-start;min-height:68px;padding-inline:clamp(18px,4vw,48px)}
.service-minimal-header nav{display:none!important}
.service-wrap{max-width:980px;margin:30px auto;padding:0 20px 64px}
.service-card{border:1px solid #e8e8f5;border-radius:24px;padding:clamp(20px,3.4vw,34px);box-shadow:0 18px 54px rgba(45,42,105,.09);}
.service-head{align-items:center;margin-bottom:26px}
.service-head>div>small{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#f0edff;color:#6255c7;font-size:10px;font-weight:800;letter-spacing:.08em}
.service-head h1{font-size:clamp(25px,3.4vw,34px);line-height:1.18;letter-spacing:-.035em;color:#242044;margin:12px 0 9px;font-weight:800}
.service-head p{font-size:14px;line-height:1.65;max-width:620px;color:#70758a}
.service-minimal-header .logo-mark{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#8b83f5,#647ff0);box-shadow:0 7px 16px rgba(99,91,213,.2)}
.form-grid{gap:18px}
.form-field{gap:8px}
.form-field label{color:#333252;font-size:13px;font-weight:750}
.form-field input,.form-field select,.form-field textarea{padding:13px 14px;border:1px solid #dedff0;border-radius:13px;background:#fcfcff;color:#292744;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:none;border-color:#8b80eb;background:#fff;box-shadow:0 0 0 4px rgba(125,111,229,.13)}
.form-field textarea{min-height:112px}
.section-title{margin-top:6px;padding-bottom:10px;border-bottom:1px solid #edecf8;color:#4d477d;font-size:14px}
.notice.info{background:#f6f5ff;border:1px solid #e8e4ff;color:#5f5c79;border-radius:13px;font-size:12px;line-height:1.6}
.actions{display:flex;flex-wrap:wrap;gap:11px;align-items:center;margin-top:24px}
.btn.premium-submit{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:47px;padding:13px 22px;border:1px solid rgba(255,255,255,.25);border-radius:14px;background:linear-gradient(115deg,#7164df 0%,#647ff0 100%);color:#fff;font-size:13px;font-weight:800;letter-spacing:.01em;box-shadow:0 9px 22px rgba(100,94,216,.24);transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.btn.premium-submit svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.premium-submit:hover{transform:translateY(-2px);box-shadow:0 13px 26px rgba(100,94,216,.3);filter:saturate(1.08)}
.btn.premium-submit:active{transform:translateY(0)}
.btn.premium-submit:focus-visible,.back-link:focus-visible{outline:3px solid rgba(122,108,226,.35);outline-offset:3px}
.btn.premium-submit:disabled{opacity:.68;transform:none;box-shadow:none}
.back-link{display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none!important;font-size:12px;font-weight:800;line-height:1.2;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease}
.back-link .premium-button-icon{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;background:rgba(111,99,221,.1);color:#5b50bd;flex:0 0 28px}
.back-link .premium-button-icon svg{display:block;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.back-link.premium-back{padding:8px 13px 8px 8px;border:1px solid #e0def8;border-radius:13px;background:linear-gradient(135deg,#fff 0%,#f7f6ff 100%);color:#5146a7;box-shadow:0 5px 14px rgba(70,63,145,.07);white-space:nowrap}
.back-link.premium-back:hover{transform:translateY(-1px);border-color:#c9c2fa;box-shadow:0 9px 20px rgba(70,63,145,.12);background:#f5f3ff}
.back-link.premium-lookup{min-height:43px;padding:11px 15px;border:1px solid #e0def8;border-radius:13px;background:#f8f7ff;color:#5a50b3}
.back-link.premium-lookup:hover{background:#efedff;border-color:#cfc9fb;transform:translateY(-1px)}
.success{background:linear-gradient(145deg,#f8f7ff,#f3f8ff);border:1px solid #e3e0fb;border-radius:19px;padding:clamp(20px,3vw,28px)}
.success>small{display:inline-block;padding:6px 10px;border-radius:999px;background:#e8f8ef;color:#23734a;font-weight:800;letter-spacing:.06em}
.success h2{color:#252348;letter-spacing:-.025em;line-height:1.25}
.code-box{color:#5046b1;background:#fff;border:1px dashed #a8a0ec;border-radius:14px}
@media(max-width:720px){
 .service-minimal-header{min-height:62px;padding-inline:16px}
 .service-wrap{margin:16px auto;padding:0 12px 36px}
 .service-card{border-radius:19px;padding:19px 16px;box-shadow:0 12px 34px rgba(45,42,105,.08)}
 .service-head{gap:14px;align-items:stretch;flex-direction:column;margin-bottom:22px}
 .service-head h1{font-size:25px;margin-top:10px}
 .service-head p{font-size:13px}
 .service-head .premium-back{align-self:flex-start}
 .form-grid{gap:15px}
 .form-field input,.form-field select,.form-field textarea{padding:12px 13px;font-size:14px}
 .actions{align-items:stretch;flex-direction:column}
 .actions .premium-submit,.actions .back-link{width:100%;box-sizing:border-box}
 .btn.premium-submit{min-height:48px}
}
@media(prefers-reduced-motion:reduce){.btn.premium-submit,.back-link,.form-field input,.form-field select,.form-field textarea{transition:none}}

</style>
</head>
<body>
<header class="header service-minimal-header">
  <a class="logo" href="index.html" aria-label="Dusun Dawung — kembali ke website utama"><span class="logo-mark">🌿</span><span><strong>DUSUN DAWUNG</strong><small>RT 04 / RW 01</small></span></a>
</header>

<main class="service-wrap">
<section class="service-card">
  <div class="service-head">
    <div>
      <small>PELAYANAN PUBLIK RT 04 / RW 01</small>
      <h1 id="pageTitle">Pengajuan Layanan</h1>
      <p id="pageDesc">Isi formulir sesuai kebutuhan Anda. Tidak perlu membuat akun warga.</p>
    </div>
    <a class="back-link premium-back" href="index.html" aria-label="Kembali ke website utama"><span class="premium-button-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14.5 5 7.5 12l7 7"/><path d="M8 12h12"/></svg></span><span>Kembali ke Website</span></a>
  </div>

  <div id="notice"></div>
  <div id="formArea"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/supabase.js"></script>
<script src="assets/pelayanan-publik.js?v=20261017-premium-form"></script>
</body>
</html>
